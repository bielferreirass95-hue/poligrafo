
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Teste do Polígrafo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="cabecalho">
    <p class="identificacao">DEPARTAMENTO DE INVESTIGAÇÃO</p>
    <p class="status">ARQUIVO DE CASO · 007</p>
</header>

<main class="principal">
    <section class="apresentacao">
        <p class="categoria">ANÁLISE COMPORTAMENTAL</p>

        <h1 id="titulo-principal">
            Sistema de Teste do Polígrafo
        </h1>

        <p class="descricao">
            Observe as perguntas, analise suas respostas
            e conclua a avaliação.
        </p>

        <div class="linha-divisoria"></div>

        <p class="aviso">
            ACESSO RESTRITO · SIMULAÇÃO INVESTIGATIVA
        </p>

        <button class="iniciar">Iniciar teste</button>

        <p id="pergunta"></p>
        <p id="resultado"></p>
        <p id="contadorDeSim"></p>
        <p id="contadorDeNao"></p>

        <button class="resposta" id="resposta-sim">SIM</button>
        <button class="resposta" id="resposta-nao">NÃO</button> 
    </section>
</main>

<footer class="rodape">
    SISTEMA EXPERIMENTAL DE ANÁLISE
</footer>

<script src="script-navegador.js"></script>
</body>
</html>
